name: Release candidate

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: splint
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d splint"
          --health-interval 5s --health-timeout 5s --health-retries 20
      minio:
        image: minio/minio:RELEASE.2024-06-13T22-53-53Z
        env:
          MINIO_ROOT_USER: splint_minio
          MINIO_ROOT_PASSWORD: splint_minio_password
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live || exit 1"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/splint
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_BUCKET: splint-originals
      S3_ACCESS_KEY_ID: splint_minio
      S3_SECRET_ACCESS_KEY: splint_minio_password
      S3_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm --prefix server ci
      - run: npm --prefix server run storage:init
      - run: npm test
      - run: npm --prefix server run check
      - run: npm --prefix server run migrate:postgres
      - run: npm --prefix server run test:postgres
      - run: npm --prefix server run migrate:postgres
      - run: npm --prefix server test
      - run: npm run lint
      - run: npm run build
      - run: npm audit --omit=dev
      - run: npm --prefix server audit --omit=dev
      - run: npm --prefix server run inventory:media
      - run: npm --prefix server run media:sweep -- --dry-run
      - run: node --check server/scripts/backup-postgres.mjs
      - run: node --check server/scripts/restore-postgres.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Check tracked artifact hygiene
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)(\.env$|.*\.db\.bin$|uploads/|backups/|test-results/|playwright-report/|.*\.dump$)'; then
            echo 'Forbidden runtime artifact is tracked.'
            exit 1
          fi
